[general]
import = [
    "~/.config/alacritty/themes/themes/github_dark_default.toml"
]

[window]
opacity = 1
blur = false
decorations = "None"

[window.padding]
x = 10
y = 10

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
